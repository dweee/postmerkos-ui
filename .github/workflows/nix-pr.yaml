name: Determinate Nix build
on:
  pull_request:
    paths:
      - .github/workflows/main.yaml
      - .github/workflows/nix-pr.yaml
      - flake.nix
      - flake.lock
      - package.json
      - package-lock.json
      - src/**
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3
        with:
          source-tag: v3.24.1
          summarize: false
          kvm: false
          extra-conf: |
            experimental-features = nix-command flakes parallel-eval
            eval-cores = 2
      - name: Verify client, daemon and application build
        run: |
          nix --version | grep -F 'Determinate Nix 3.24.1'
          nix store info --store daemon --json
          nix develop --command bash -euc 'npm ci; npm run build'
